name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Clean-stack integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Public-safety scan
        run: ./scripts/check-public-safety.sh

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate all Compose profiles
        run: docker compose --profile all config --quiet

      - name: Start a clean core stack
        run: ./scripts/dev-stack.sh reset core

      - name: Run infrastructure smoke test
        run: ./scripts/smoke-test.sh

      - name: Exercise PowerShell status command
        shell: pwsh
        run: ./scripts/dev-stack.ps1 status core

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile all logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  broker-profile-test:
    name: Optional Artemis profile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start broker profile
        run: ./scripts/dev-stack.sh reset broker

      - name: Verify Artemis container
        run: |
          docker compose --profile broker ps artemis
          test "$(docker compose --profile broker ps --status running -q artemis | wc -l)" -eq 1

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
