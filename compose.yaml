name: local-microservice-dev-stack

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.3}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-dev_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_DB: postgres
      DEV_DATABASES: ${DEV_DATABASES:-catalog_db:catalog_app,orders_db:orders_app,billing_db:billing_app}
      DEV_DATABASE_PASSWORD: ${DEV_DATABASE_PASSWORD:?DEV_DATABASE_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-dev_admin} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
